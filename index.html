<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#030202">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>The Lore of The Last Name of God</title>

<style>

/* ============================================================
   THE LORE OF THE LAST NAME OF GOD
   PHYSICAL LOREBOOK — PROTOTYPE
   ============================================================ */

:root{
    --gold:#c29b55;
    --gold-light:#e2c783;
    --gold-dark:#62451f;

    --red:#4b080d;
    --red-dark:#180305;

    --paper:#d0bd8d;
    --paper-dark:#9d8759;

    --black:#020202;

    --book-width:min(94vw,1500px);
    --book-height:min(84vh,850px);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;

    overflow:hidden;

    background:#020202;

    touch-action:none;
    overscroll-behavior:none;

    user-select:none;
}

body{
    font-family:
        Georgia,
        "Times New Roman",
        serif;
}


/* ============================================================
   STAGE
   ============================================================ */

#stage{

    position:fixed;

    inset:0;

    width:100vw;
    height:100dvh;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:

        radial-gradient(
            ellipse at center,
            #190609 0%,
            #090304 45%,
            #020202 100%
        );
}


/* hard cinematic vignette */

#stage::after{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 48%,
            rgba(0,0,0,.58) 100%
        );

    z-index:900;
}


/* ============================================================
   BOOK
   ============================================================ */

#book{

    position:relative;

    width:var(--book-width);
    height:var(--book-height);

    max-width:1500px;
    max-height:850px;

    perspective:2600px;

    transform-style:preserve-3d;

    filter:
        drop-shadow(
            0 35px 32px rgba(0,0,0,.9)
        );

    will-change:transform;
}


/* ============================================================
   PHYSICAL BOOK BODY
   ============================================================ */

.book-body{

    position:absolute;

    inset:0;

    z-index:1;

    border-radius:8px;

    background:

        linear-gradient(
            90deg,
            #170304 0%,
            #4c090e 7%,
            #210407 48%,
            #510b11 93%,
            #120203 100%
        );

    box-shadow:

        inset 0 0 0 3px #080202,

        inset 0 0 25px rgba(0,0,0,.95),

        0 18px 0 #050202,

        0 0 0 2px #010101;
}


/* ============================================================
   INNER BOOK
   ============================================================ */

.book-inner{

    position:absolute;

    left:4.5%;
    right:1.2%;
    top:1.5%;
    bottom:1.5%;

    overflow:hidden;

    z-index:5;

    background:#8e7548;

    box-shadow:

        inset 0 0 20px rgba(0,0,0,.7),

        0 0 0 2px #120904;
}


/* ============================================================
   TWO PAGE SPREAD
   ============================================================ */

.spread{

    position:absolute;

    inset:0;

    display:grid;

    grid-template-columns:1fr 1fr;

    overflow:hidden;

    background:#bca675;
}


/* ============================================================
   PAPER
   ============================================================ */

.page{

    position:relative;

    overflow:hidden;

    background:

        linear-gradient(
            90deg,
            rgba(53,35,16,.35),
            transparent 12%,
            transparent 86%,
            rgba(42,26,10,.25)
        ),

        repeating-linear-gradient(
            0deg,
            rgba(65,40,14,.035) 0px,
            rgba(65,40,14,.035) 1px,
            transparent 1px,
            transparent 5px
        ),

        linear-gradient(
            135deg,
            #d6c398,
            #bba474
        );

    color:#28190d;

    box-shadow:
        inset 0 0 28px rgba(49,29,8,.42);
}


/* paper border */

.page::before{

    content:"";

    position:absolute;

    inset:18px;

    border:

        1px solid
        rgba(93,63,25,.52);

    box-shadow:

        inset 0 0 0 3px
        rgba(120,88,37,.08);

    pointer-events:none;

    z-index:10;
}


/* paper scratches */

.page::after{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    opacity:.15;

    background:

        repeating-linear-gradient(
            83deg,
            transparent 0 27px,
            rgba(57,35,13,.13) 28px,
            transparent 29px 52px
        );
}


/* ============================================================
   CENTER SPINE SHADOW
   ============================================================ */

.spine-shadow{

    position:absolute;

    top:0;
    bottom:0;

    left:50%;

    width:38px;

    transform:translateX(-50%);

    z-index:40;

    pointer-events:none;

    background:

        linear-gradient(
            90deg,
            rgba(0,0,0,.52),
            rgba(0,0,0,.08),
            rgba(255,255,255,.09),
            rgba(0,0,0,.5)
        );

    box-shadow:

        0 0 15px rgba(0,0,0,.45);
}


/* ============================================================
   PAGE CONTENT
   ============================================================ */

.content{

    position:absolute;

    inset:9% 10%;

    z-index:15;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;
}


.kicker{

    font-size:11px;

    letter-spacing:.32em;

    color:#73501f;

    text-transform:uppercase;

    margin-bottom:10px;
}


.title{

    margin:0;

    color:#2a190b;

    font-size:
        clamp(
            24px,
            2.6vw,
            44px
        );

    letter-spacing:.1em;

    font-weight:500;
}


.subtitle{

    margin-top:8px;

    color:#6e4e20;

    font-size:
        clamp(
            11px,
            1vw,
            16px
        );

    letter-spacing:.18em;

    text-transform:uppercase;
}


.body-text{

    max-width:600px;

    margin-top:28px;

    color:#30200e;

    font-size:
        clamp(
            12px,
            1.05vw,
            17px
        );

    line-height:1.7;
}


.quote{

    max-width:570px;

    margin:25px 0;

    padding:
        17px 25px;

    border-left:
        2px solid #765321;

    border-right:
        1px solid rgba(118,83,33,.35);

    color:#3b250e;

    font-style:italic;

    font-size:
        clamp(
            15px,
            1.25vw,
            21px
        );

    line-height:1.5;
}


/* ============================================================
   COSMIC SYMBOL
   ============================================================ */

.symbol{

    position:relative;

    width:
        clamp(
            130px,
            17vw,
            250px
        );

    aspect-ratio:1;

    margin-bottom:25px;
}


.symbol .ring{

    position:absolute;

    border:
        1px solid #755321;

    border-radius:50%;
}


.symbol .r1{
    inset:0;
}

.symbol .r2{
    inset:12%;
}

.symbol .r3{
    inset:28%;

    border-style:dashed;
}

.symbol .r4{
    inset:38%;

    transform:rotate(35deg);

    border-radius:25%;
}


.symbol .cross{

    position:absolute;

    left:50%;
    top:8%;
    bottom:8%;

    width:1px;

    background:#755321;

    transform:translateX(-50%);
}


.symbol .cross2{

    position:absolute;

    top:50%;
    left:8%;
    right:8%;

    height:1px;

    background:#755321;

    transform:translateY(-50%);
}


.symbol .core{

    position:absolute;

    left:50%;
    top:50%;

    width:24%;

    aspect-ratio:1;

    transform:
        translate(-50%,-50%)
        rotate(45deg);

    background:#29170c;

    border:
        2px solid #a17a37;

    box-shadow:
        0 0 0 7px rgba(111,78,30,.1);
}


/* ============================================================
   ARTIFACT DECORATION
   ============================================================ */

.ornament{

    position:absolute;

    width:55px;
    height:55px;

    border:
        2px solid #85602b;

    opacity:.65;

    z-index:20;
}


.ornament.tl{
    top:25px;
    left:25px;

    border-right:0;
    border-bottom:0;
}


.ornament.tr{
    top:25px;
    right:25px;

    border-left:0;
    border-bottom:0;
}


.ornament.bl{
    bottom:25px;
    left:25px;

    border-right:0;
    border-top:0;
}


.ornament.br{
    bottom:25px;
    right:25px;

    border-left:0;
    border-top:0;
}


/* ============================================================
   PAGE NUMBER
   ============================================================ */

.page-number{

    position:absolute;

    bottom:22px;

    font-size:10px;

    color:#735321;

    letter-spacing:.2em;

    z-index:20;
}


.left .page-number{
    left:9%;
}


.right .page-number{
    right:9%;
}


/* ============================================================
   PAGE TURN LAYER
   ============================================================ */

.turn-layer{

    position:absolute;

    top:0;
    bottom:0;

    width:50%;

    z-index:100;

    display:none;

    transform-style:preserve-3d;

    pointer-events:none;
}


.turn-layer.forward{

    right:0;

    transform-origin:left center;
}


.turn-layer.backward{

    left:0;

    transform-origin:right center;
}


.turn-layer.active{

    display:block;
}


.turn-face{

    position:absolute;

    inset:0;

    backface-visibility:hidden;

    overflow:hidden;

    background:#c9b584;

    box-shadow:
        inset 0 0 22px rgba(0,0,0,.35);
}


.turn-back{

    transform:rotateY(180deg);
}


/* ============================================================
   PAGE TURN SHADOW
   ============================================================ */

.turn-shadow{

    position:absolute;

    top:0;
    bottom:0;

    width:18px;

    opacity:0;

    z-index:110;

    pointer-events:none;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(0,0,0,.45),
            transparent
        );

    filter:blur(4px);
}


/* ============================================================
   SPINE
   ============================================================ */

.spine{

    position:absolute;

    left:0;

    top:0;
    bottom:0;

    width:5%;

    z-index:150;

    background:

        linear-gradient(
            90deg,
            #080202,
            #411015 35%,
            #170305 70%,
            #050101
        );

    box-shadow:

        inset -4px 0 8px rgba(0,0,0,.8),

        inset 4px 0 8px rgba(130,65,30,.2);
}


.spine-band{

    position:absolute;

    left:8%;
    right:5%;

    height:7%;

    min-height:25px;

    border-top:
        2px solid #8b6733;

    border-bottom:
        2px solid #4b321a;

    background:
        linear-gradient(
            #32110e,
            #6a2b1c,
            #1d0707
        );

    box-shadow:
        0 2px 7px rgba(0,0,0,.7);
}


.spine-band:nth-child(1){
    top:8%;
}

.spine-band:nth-child(2){
    top:46%;
}

.spine-band:nth-child(3){
    bottom:8%;
}


/* ============================================================
   FRONT COVER
   ============================================================ */

#cover{

    position:absolute;

    inset:0;

    z-index:300;

    transform-style:preserve-3d;

    transform-origin:left center;

    cursor:grab;

    will-change:transform;

    transition:
        transform
        .95s
        cubic-bezier(.2,.75,.14,1);
}


#cover.dragging{

    transition:none;

    cursor:grabbing;
}


.cover-front,
.cover-back{

    position:absolute;

    inset:0;

    overflow:hidden;

    border-radius:6px;

    backface-visibility:hidden;
}


/* YOUR EXACT REFERENCE IMAGE */

.cover-front{

    background:#120304;
}


.cover-front img{

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    object-position:center;

    pointer-events:none;

    -webkit-user-drag:none;
}


/* physical cover edge */

.cover-front::after{

    content:"";

    position:absolute;

    inset:0;

    border:
        3px solid rgba(6,2,1,.9);

    box-shadow:

        inset 0 0 0 2px
        rgba(208,164,79,.25),

        inset 0 0 35px
        rgba(0,0,0,.65);

    pointer-events:none;
}


/* reverse side of cover */

.cover-back{

    transform:rotateY(180deg);

    background:

        linear-gradient(
            135deg,
            #260609,
            #5a1016,
            #1c0305
        );

    box-shadow:
        inset 0 0 30px rgba(0,0,0,.8);
}


.cover-back::before{

    content:"";

    position:absolute;

    inset:6%;

    border:
        1px solid #9b7637;

    box-shadow:
        inset 0 0 0 8px rgba(30,5,6,.35);
}


/* ============================================================
   OPEN STATE
   ============================================================ */

#book.open #cover{

    transform:rotateY(-168deg);

    pointer-events:none;
}


/* ============================================================
   SETTINGS BUTTON
   ============================================================ */

#settingsButton{

    position:fixed;

    top:
        max(
            12px,
            env(safe-area-inset-top)
        );

    right:
        max(
            12px,
            env(safe-area-inset-right)
        );

    z-index:1000;

    width:38px;
    height:38px;

    border:
        1px solid
        rgba(190,151,79,.55);

    background:
        rgba(10,3,4,.82);

    color:#d1ad63;

    border-radius:50%;

    font-size:17px;

    cursor:pointer;

    opacity:.45;

    transition:
        opacity .2s,
        transform .2s;
}


#settingsButton:hover{

    opacity:1;

    transform:rotate(30deg);
}


/* ============================================================
   SETTINGS PANEL
   ============================================================ */

#settingsPanel{

    position:fixed;

    top:62px;

    right:14px;

    z-index:1100;

    width:
        min(
            310px,
            calc(100vw - 28px)
        );

    max-height:
        calc(100dvh - 90px);

    overflow:auto;

    padding:20px;

    background:

        linear-gradient(
            145deg,
            #210608,
            #0b0203
        );

    border:
        1px solid #76562a;

    box-shadow:
        0 20px 50px rgba(0,0,0,.8),

        inset 0 0 25px rgba(0,0,0,.7);

    color:#d4b66f;

    opacity:0;

    transform:
        translateY(-10px)
        scale(.97);

    pointer-events:none;

    transition:
        .2s ease;
}


#settingsPanel.show{

    opacity:1;

    transform:
        translateY(0)
        scale(1);

    pointer-events:auto;
}


.settings-title{

    margin:0 0 16px;

    font-size:17px;

    letter-spacing:.18em;

    color:#e0c27b;

    text-align:center;
}


.setting{

    padding:12px 0;

    border-top:
        1px solid
        rgba(150,112,52,.25);
}


.setting label{

    display:block;

    margin-bottom:8px;

    font-size:11px;

    letter-spacing:.15em;

    text-transform:uppercase;

    color:#a88950;
}


.setting button{

    padding:7px 9px;

    margin:
        2px 3px 2px 0;

    border:
        1px solid #60471f;

    background:#140406;

    color:#c8a963;

    border-radius:2px;

    font-family:Georgia,serif;

    cursor:pointer;
}


.setting button.selected{

    background:#5b0d13;

    border-color:#bb9147;

    color:#ead18a;
}


.close-settings{

    position:absolute;

    top:8px;

    right:10px;

    border:0;

    background:none;

    color:#a8864c;

    font-size:18px;

    cursor:pointer;
}


/* ============================================================
   NAVIGATION
   ============================================================ */

#navigation{

    position:fixed;

    left:50%;

    bottom:
        max(
            12px,
            env(safe-area-inset-bottom)
        );

    transform:
        translateX(-50%);

    z-index:1000;

    display:flex;

    gap:7px;

    opacity:.25;

    transition:.2s;
}


#navigation:hover{

    opacity:.9;
}


.nav-button{

    width:38px;
    height:30px;

    border:
        1px solid #76562b;

    background:
        rgba(13,3,4,.9);

    color:#c7a55d;

    cursor:pointer;

    font-family:Georgia,serif;
}


/* ============================================================
   PAGE COUNTER
   ============================================================ */

#counter{

    position:fixed;

    left:18px;

    bottom:
        max(
            15px,
            env(safe-area-inset-bottom)
        );

    z-index:1000;

    color:#9a783c;

    font-size:10px;

    letter-spacing:.2em;

    opacity:.35;
}


/* ============================================================
   PORTRAIT
   ============================================================ */

@media (orientation:portrait){

    #stage::before{

        content:"ROTATE YOUR PHONE";

        position:fixed;

        inset:0;

        z-index:5000;

        display:flex;

        align-items:center;

        justify-content:center;

        background:#030202;

        color:#c6a45e;

        font-family:Georgia,serif;

        font-size:13px;

        letter-spacing:.28em;
    }
}


/* ============================================================
   SMALL LANDSCAPE PHONES
   ============================================================ */

@media (max-height:500px) and (orientation:landscape){

    :root{
        --book-height:88vh;
    }

    .content{
        inset:7% 8%;
    }

    .body-text{
        margin-top:12px;
        line-height:1.45;
    }

    .quote{
        margin:12px 0;
    }

    .symbol{
        width:110px;
        margin-bottom:12px;
    }
}


/* ============================================================
   INSTANT MODE
   ============================================================ */

.instant *{

    transition:none !important;

    animation:none !important;
}

</style>
</head>


<body>


<!-- ============================================================
     STAGE
     ============================================================ -->

<div id="stage">


    <!-- ========================================================
         BOOK
         ======================================================== -->

    <main id="book">


        <!-- physical book body -->

        <div class="book-body"></div>


        <!-- inner page area -->

        <section class="book-inner">


            <!-- current two-page spread -->

            <div
                class="spread"
                id="spread"
            >


                <article
                    class="page left"
                    id="leftPage"
                ></article>


                <article
                    class="page right"
                    id="rightPage"
                ></article>


                <div class="spine-shadow"></div>


            </div>


            <!-- temporary turning sheet -->

            <div
                class="turn-layer"
                id="turnLayer"
            >

                <div
                    class="turn-face"
                    id="turnFront"
                ></div>

                <div
                    class="turn-face turn-back"
                    id="turnBack"
                ></div>

            </div>


        </section>


        <!-- physical spine -->

        <div class="spine">

            <div class="spine-band"></div>
            <div class="spine-band"></div>
            <div class="spine-band"></div>

        </div>


        <!-- ====================================================
             FRONT COVER
             ==================================================== -->

        <div id="cover">


            <div class="cover-front">

                <!--
                    PUT YOUR REFERENCE IMAGE HERE:

                    cover.png

                    The image you sent is 1536 × 936.
                    Keep it at its original ratio.
                -->

                <img
                    src="cover.png"
                    alt="The Lore of The Last Name of God"
                    draggable="false"
                >

            </div>


            <div class="cover-back"></div>


        </div>


    </main>


</div>


<!-- ============================================================
     SETTINGS
     ============================================================ -->

<button
    id="settingsButton"
    aria-label="Settings"
>
    ⚙
</button>


<section
    id="settingsPanel"
>


    <button
        class="close-settings"
        id="closeSettings"
    >
        ×
    </button>


    <h2 class="settings-title">
        BOOK SETTINGS
    </h2>


    <div class="setting">

        <label>
            Page Navigation
        </label>

        <button
            data-nav="swipe"
            class="selected"
        >
            Swipe
        </button>

        <button
            data-nav="buttons"
        >
            Buttons
        </button>

    </div>


    <div class="setting">

        <label>
            Page Animation
        </label>

        <button
            data-animation="realistic"
            class="selected"
        >
            Realistic
        </button>

        <button
            data-animation="smooth"
        >
            Smooth
        </button>

        <button
            data-animation="instant"
        >
            Instant
        </button>

    </div>


    <div class="setting">

        <label>
            Page Sound
        </label>

        <button
            id="soundButton"
            class="selected"
        >
            Sound ON
        </button>

    </div>


    <div class="setting">

        <label>
            Ambient Effects
        </label>

        <button
            id="ambientButton"
            class="selected"
        >
            Ambient ON
        </button>

    </div>


    <div class="setting">

        <label>
            Display
        </label>

        <button id="fullscreenButton">
            Fullscreen
        </button>

    </div>


</section>


<!-- ============================================================
     NAVIGATION
     ============================================================ -->

<nav id="navigation">

    <button
        class="nav-button"
        id="previousButton"
    >
        ‹
    </button>

    <button
        class="nav-button"
        id="nextButton"
    >
        ›
    </button>

</nav>


<div id="counter">
    COVER
</div>


<script>

/* ============================================================
   THE LORE OF THE LAST NAME OF GOD
   PHYSICAL BOOK ENGINE
   ============================================================ */


/* ============================================================
   ELEMENTS
   ============================================================ */

const book =
    document.getElementById("book");

const cover =
    document.getElementById("cover");

const spread =
    document.getElementById("spread");

const leftPage =
    document.getElementById("leftPage");

const rightPage =
    document.getElementById("rightPage");

const turnLayer =
    document.getElementById("turnLayer");

const turnFront =
    document.getElementById("turnFront");

const turnBack =
    document.getElementById("turnBack");

const counter =
    document.getElementById("counter");

const settingsButton =
    document.getElementById("settingsButton");

const settingsPanel =
    document.getElementById("settingsPanel");

const closeSettings =
    document.getElementById("closeSettings");

const navigation =
    document.getElementById("navigation");


/* ============================================================
   LORE PAGES
   ============================================================ */

const pages = [

    {
        type:"intro",
        title:"BEFORE THE BEGINNING",
        subtitle:"The First Record",

        quote:
        "You believe everything began with something? You are wrong.",

        text:
        "The oldest surviving record does not describe a beginning. It describes the moment existence first became capable of remembering one."
    },


    {
        type:"light",
        title:"THE FIRST LIGHT",
        subtitle:"When existence became visible",

        text:

/* ============================================================
   BOOK STATE
   ============================================================ */

/*
   spreadIndex:

   0 = pages 1 + 2
   1 = pages 3 + 4
   2 = pages 5 + 6
*/

let spreadIndex = 0;

let bookOpened = false;

let flipping = false;

let soundEnabled = true;

let ambientEnabled = true;

let navigationMode = "swipe";

let animationMode = "realistic";


/* ============================================================
   PAGE HTML
   ============================================================ */

function createPageHTML(data, number){

                <div class="cross"></div>
                <div class="cross2"></div>
                <div class="core"></div>
            </div>

                <div class="ring r3"></div>

/* ============================================================
   SET CURRENT SPREAD
   ============================================================ */

function renderSpread(index){

    const leftIndex =
        index * 2;

    const rightIndex =
        leftIndex + 1;

    leftPage.innerHTML =
        createPageHTML(
            pages[leftIndex],
            leftIndex + 1
        );

    rightPage.innerHTML =
        createPageHTML(
            pages[rightIndex],
            rightIndex + 1
        );

    counter.textContent =
        `${leftIndex + 1} — ${rightIndex + 1}`;
}


/* ============================================================
   SOUND ENGINE
   ============================================================ */

let audioContext = null;


function getAudio(){

    if(!audioContext){

        const Audio =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!Audio){
            return null;
        }

        audioContext =
            new Audio();

    }

    return audioContext;
}


/*
   Lightweight generated paper rustle.

   No external audio file means:
   - no loading delay
   - no network request
   - no missing file
   - works offline
*/

function pageSound(){

    if(!soundEnabled){
        return;
    }

    const ctx =
        getAudio();

    if(!ctx){
        return;
    }

    if(ctx.state === "suspended"){
        ctx.resume();
    }


    const duration =
        animationMode === "instant"
        ? .08
        : .25;


    const buffer =
        ctx.createBuffer(
            1,
            ctx.sampleRate * duration,
            ctx.sampleRate
        );


    const data =
        buffer.getChannelData(0);


    for(
        let i = 0;
        i < data.length;
        i++
    ){

        const t =
            i / data.length;

        data[i] =
            (Math.random()*2-1)
            *
            Math.pow(
                1-t,
                2.1
            );
    }


    const source =
        ctx.createBufferSource();

    const filter =
        ctx.createBiquadFilter();

    const gain =
        ctx.createGain();


    filter.type =
        "bandpass";

    filter.frequency.value =
        1300;

    filter.Q.value =
        .7;


    gain.gain.setValueAtTime(
        .12,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        ctx.currentTime + duration
    );


    source.buffer =
        buffer;

    source.connect(filter);

    filter.connect(gain);

    gain.connect(
        ctx.destination
    );

    source.start();

    source.stop(
        ctx.currentTime + duration
    );
}


/* ============================================================
   OPEN COVER
   ============================================================ */

async function enterFullscreen(){

    try{

        if(!document.fullscreenElement){

            await document.documentElement
                .requestFullscreen({
                    navigationUI:"hide"
                });

        }

    }catch(e){}


    try{

        if(
            screen.orientation &&
            screen.orientation.lock
        ){

            await screen.orientation.lock(
                "landscape"
            );

        }

    }catch(e){}
}


function openBook(){

    if(bookOpened){
        return;
    }

    enterFullscreen();

    pageSound();

    bookOpened = true;

    book.classList.add("open");

    counter.textContent = "01 — 02";

}


/* ============================================================
   PAGE FLIP
   ============================================================ */

function flip(direction){

    if(!bookOpened){
        return;
    }

    if(flipping){
        return;
    }


    /*
       direction:

       +1 = next spread
       -1 = previous spread
    */

    const nextIndex =
        spreadIndex + direction;


    if(
        nextIndex < 0 ||
        nextIndex > 2
    ){
        return;
    }


    flipping = true;


    const currentLeft =
        spreadIndex * 2;

    const currentRight =
        currentLeft + 1;


    const nextLeft =
        nextIndex * 2;

    const nextRight =
        nextLeft + 1;


    /*
       The page underneath the turn is changed first.
    */

    if(direction > 0){

        /*
           Forward:
           right page folds toward the left.
        */

        turnLayer.className =
            "turn-layer forward active";


        turnFront.innerHTML =
            createPageHTML(
                pages[currentRight],
                currentRight + 1
            );


        turnBack.innerHTML =
            createPageHTML(
                pages[nextLeft],
                nextLeft + 1
            );


        /*
           Reveal next spread behind it.
        */

        leftPage.innerHTML =
            createPageHTML(
                pages[nextLeft],
                nextLeft + 1
            );

        rightPage.innerHTML =
            createPageHTML(
                pages[nextRight],
                nextRight + 1
            );

    }else{

        /*
           Backward:
           left page folds toward the right.
        */

        turnLayer.className =
            "turn-layer backward active";


        turnFront.innerHTML =
            createPageHTML(
                pages[currentLeft],
                currentLeft + 1
            );


        turnBack.innerHTML =
            createPageHTML(
                pages[nextRight],
                nextRight + 1
            );


        leftPage.innerHTML =
            createPageHTML(
                pages[nextLeft],
                nextLeft + 1
            );

        rightPage.innerHTML =
            createPageHTML(
                pages[nextRight],
                nextRight + 1
            );

    }


    /*
       Animation mode.
    */

    let duration = 850;


    if(animationMode === "smooth"){
        duration = 620;
    }

    if(animationMode === "instant"){
        duration = 1;
    }


    if(animationMode === "instant"){

        turnLayer.style.transform =
            direction > 0
            ? "rotateY(-180deg)"
            : "rotateY(180deg)";

    }else{

        turnLayer.style.transition =
            `transform ${duration}ms cubic-bezier(.2,.75,.14,1)`;


        requestAnimationFrame(()=>{

            requestAnimationFrame(()=>{

                turnLayer.style.transform =
                    direction > 0
                    ? "rotateY(-180deg)"
                    : "rotateY(180deg)";

            });

        });

    }


    pageSound();


    setTimeout(
        ()=>{

            spreadIndex =
                nextIndex;


            turnLayer.className =
                "turn-layer";


            turnLayer.style.transition =
                "";

            turnLayer.style.transform =
                "";


            renderSpread(
                spreadIndex
            );


            counter.textContent =
                `${spreadIndex*2+1} — ${spreadIndex*2+2}`;


            flipping = false;

        },
        animationMode === "instant"
        ? 30
        : duration + 30
    );

}


/* ============================================================
   POINTER DRAG — PAGE FOLLOW
   ============================================================ */

let drag = null;


book.addEventListener(
    "pointerdown",
    function(event){

        if(!bookOpened){
            return;
        }

        if(flipping){
            return;
        }

        if(navigationMode !== "swipe"){
            return;
        }


        const rect =
            book.getBoundingClientRect();


        const x =
            event.clientX -
            rect.left;


        const center =
            rect.width / 2;


        const direction =
            x > center
            ? 1
            : -1;


        /*
           Don't start dragging beyond book limits.
        */

        if(
            direction > 0 &&
            spreadIndex >= 2
        ){
            return;
        }


        if(
            direction < 0 &&
            spreadIndex <= 0
        ){
            return;
        }


        drag = {

            startX:
                event.clientX,

            currentX:
                event.clientX,

            direction,

            active:false

        };


        book.setPointerCapture(
            event.pointerId
        );

    },
    {
        passive:false
    }
);


/* ============================================================
   DRAG MOVE
   ============================================================ */

book.addEventListener(
    "pointermove",
    function(event){

        if(!drag){
            return;
        }


        drag.currentX =
            event.clientX;


        const dx =
            drag.currentX -
            drag.startX;


        /*
           Forward drag:
           right → left

           Backward drag:
           left → right
        */

        const signed =
            drag.direction > 0
            ? -dx
            : dx;


        const width =
            book.clientWidth / 2;


        const progress =
            Math.max(
                0,
                Math.min(
                    1,
                    signed / width
                )
            );


        /*
           Don't activate the actual animation
           until the finger has moved.
        */

        if(
            Math.abs(dx) > 5 &&
            !drag.active
        ){

            drag.active = true;

            turnLayer.className =
                "turn-layer " +
                (
                    drag.direction > 0
                    ? "forward"
                    : "backward"
                ) +
                " active";


            const current =
                spreadIndex * 2;


            if(drag.direction > 0){

                turnFront.innerHTML =
                    createPageHTML(
                        pages[current+1],
                        current+2
                    );

                turnBack.innerHTML =
                    createPageHTML(
                        pages[current+2],
                        current+3
                    );

            }else{

                turnFront.innerHTML =
                    createPageHTML(
                        pages[current],
                        current+1
                    );

                turnBack.innerHTML =
                    createPageHTML(
                        pages[current-1],
                        current
                    );

            }

        }


        if(!drag.active){
            return;
        }


        const angle =
            drag.direction > 0
            ? -180 * progress
            : 180 * progress;


        turnLayer.style.transform =
            `rotateY(${angle}deg)`;

    },
    {
        passive:false
    }
);


/* ============================================================
   DRAG RELEASE
   ============================================================ */

function finishDrag(){

    if(!drag){
        return;
    }


    const dx =
        drag.currentX -
        drag.startX;


    const signed =
        drag.direction > 0
        ? -dx
        : dx;


    const threshold =
        book.clientWidth * .14;


    const commit =
        signed > threshold;


    const direction =
        drag.direction;


    drag = null;


    if(!commit){

        /*
           Cancel and return sheet.
        */

        turnLayer.style.transition =
            "transform .35s cubic-bezier(.2,.75,.14,1)";


        turnLayer.style.transform =
            "rotateY(0deg)";


        setTimeout(()=>{

            turnLayer.className =
                "turn-layer";

            turnLayer.style.transition =
                "";

            turnLayer.style.transform =
                "";

        },370);


        return;

    }


    /*
       Complete the turn.
    */

    flipping = true;


    turnLayer.style.transition =
        "transform .48s cubic-bezier(.2,.75,.14,1)";


    turnLayer.style.transform =
        direction > 0
        ? "rotateY(-180deg)"
        : "rotateY(180deg)";


    pageSound();


    setTimeout(()=>{

        spreadIndex += direction;

        turnLayer.className =
            "turn-layer";

        turnLayer.style.transition =
            "";

        turnLayer.style.transform =
            "";

        renderSpread(
            spreadIndex
        );

        counter.textContent =
            `${spreadIndex*2+1} — ${spreadIndex*2+2}`;

        flipping = false;

    },500);

}


book.addEventListener(
    "pointerup",
    finishDrag
);


book.addEventListener(
    "pointercancel",
    finishDrag
);

   ============================================================ */

document.addEventListener(
    "keydown",
    event=>{

        if(event.key === "ArrowRight"){
            flip(1);
        }

        if(event.key === "ArrowLeft"){
            flip(-1);
        }

        if(event.key === "Escape"){

            settingsPanel
                .classList
                .remove("show");

        }

    }
);

            ()=>{
