<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<meta name="theme-color" content="#050203">

<title>The Lore of The Last Name of God</title>

<style>

/* =========================================================
   THE LORE OF THE LAST NAME OF GOD
   FULL-WIDTH CINEMATIC LOREBOOK
   ========================================================= */

:root{
  --gold:#c8a15a;
  --gold-light:#ead18b;

  /*
     The book is ALWAYS 16:9.
     It chooses the largest 16:9 rectangle
     that fits inside the screen.
  */
  --book-width:
    min(
      96vw,
      calc(88vh * 1.7777778),
      1600px
    );

  --book-height:
    calc(var(--book-width) * .5625);
}


/* =========================================================
   RESET
   ========================================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}


html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#050203;
}


body{
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  color:var(--gold-light);

  user-select:none;
  -webkit-user-select:none;

  touch-action:none;
}


/* =========================================================
   STAGE
   ========================================================= */

#stage{
  position:fixed;
  inset:0;

  display:grid;
  place-items:center;

  overflow:hidden;

  background:
    radial-gradient(
      ellipse at 50% 48%,
      #1b0508 0%,
      #080203 48%,
      #020102 100%
    );
}


/* =========================================================
   BOOK
   ========================================================= */

#book{
  position:relative;

  width:var(--book-width);
  height:var(--book-height);

  aspect-ratio:16 / 9;

  perspective:2400px;

  filter:
    drop-shadow(
      0 28px 35px #000
    );
}


/* =========================================================
   OUTER LEATHER BODY
   ========================================================= */

#book::before{
  content:"";

  position:absolute;

  inset:-12px;

  z-index:0;

  border-radius:10px;

  background:
    linear-gradient(
      90deg,
      #120304 0%,
      #541017 4%,
      #250507 50%,
      #541017 96%,
      #100203 100%
    );

  box-shadow:
    inset 0 0 0 2px #080202,
    0 12px 0 #010101;
}


/* =========================================================
   READING SURFACE

   IMPORTANT:
   This is ONE WIDE PAGE.

   No:
      LEFT PAGE | RIGHT PAGE

   No center gutter.
   No center spine.
   No fake partition.
   ========================================================= */

#reading{
  position:absolute;
  inset:0;

  z-index:2;

  overflow:hidden;

  border:
    1px solid #21130b;

  background:#18100b;

  box-shadow:
    inset 0 0 35px #000;
}


/* =========================================================
   CURRENT PAGE
   ========================================================= */

#pageCurrent,
#pageBack,
#turnSheet{
  position:absolute;

  inset:0;

  overflow:hidden;

  background:#cdb98a;
}


#pageBack{
  z-index:1;
}


#pageCurrent{
  z-index:2;
}


/* =========================================================
   PAGE IMAGES
   ========================================================= */

#pageCurrent img,
#pageBack img,
#turnSheet img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;

  pointer-events:none;

  -webkit-user-drag:none;
}


/* =========================================================
   SUBTLE PAGE LIGHT
   ========================================================= */

#pageCurrent::after,
#pageBack::after,
#turnSheet::after{

  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  box-shadow:
    inset 0 0 28px
    rgba(20,8,2,.28);
}


/* =========================================================
   TURNING SHEET

   FULL WIDTH.

   This is the important difference.

   The page is NOT a half-page.
   It is NOT a vertical stick.
   It is NOT split in two.

   The entire page turns as one sheet.
   ========================================================= */

#turnSheet{

  z-index:10;

  display:none;

  transform-style:preserve-3d;

  backface-visibility:hidden;

  will-change:transform;

  box-shadow:
    0 0 28px
    rgba(0,0,0,.55);
}


#turnSheet.active{
  display:block;
}


/* =========================================================
   FORWARD TURN

   Swipe left:
   current page leaves toward the left.
   ========================================================= */

#turnSheet.next{
  transform-origin:right center;
}


/* =========================================================
   BACKWARD TURN

   Swipe right:
   current page leaves toward the right.
   ========================================================= */

#turnSheet.prev{
  transform-origin:left center;
}


/* =========================================================
   PAGE EDGE SHADOW
   ========================================================= */

#turnSheet::before{

  content:"";

  position:absolute;

  inset:0;

  z-index:3;

  pointer-events:none;

  background:
    linear-gradient(
      90deg,
      transparent 82%,
      rgba(0,0,0,.32) 100%
    );
}


#turnSheet.prev::before{

  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.32),
      transparent 18%
    );
}


/* =========================================================
   COVER

   The cover itself is also a single 16:9 sheet.
   ========================================================= */

#cover{

  position:absolute;

  inset:0;

  z-index:20;

  overflow:hidden;

  cursor:pointer;

  transform-origin:left center;

  transform-style:preserve-3d;

  will-change:transform;

  box-shadow:
    0 0 35px rgba(0,0,0,.7);
}


/* =========================================================
   OPEN COVER
   ========================================================= */

#cover.open{

  transform:
    rotateY(-168deg);

  pointer-events:none;
}


/* =========================================================
   COVER IMAGE
   ========================================================= */

#cover img{

  width:100%;
  height:100%;

  display:block;

  object-fit:cover;

  pointer-events:none;
}


/* =========================================================
   COVER BORDER
   ========================================================= */

#cover::after{

  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  border:
    2px solid #130b06;

  box-shadow:

    inset
    0 0 0 1px
    #9a7335,

    inset
    0 0 38px
    #000;
}


/* =========================================================
   LEFT LEATHER EDGE

   This is ONLY the outer physical binding.

   It is NOT a center partition.
   ========================================================= */

#bookEdge{

  position:absolute;

  left:-7px;
  top:0;
  bottom:0;

  width:8px;

  z-index:30;

  background:
    linear-gradient(
      90deg,
      #090203,
      #5a1117,
      #210406
    );

  box-shadow:
    4px 0 10px #000;

  pointer-events:none;
}


/* =========================================================
   SETTINGS BUTTON
   ========================================================= */

#settingsButton{

  position:fixed;

  top:
    max(
      12px,
      env(safe-area-inset-top)
    );

  right:
    max(
      12px,
      env(safe-area-inset-right)
    );

  z-index:100;

  width:42px;
  height:42px;

  border:
    1px solid #76562b;

  border-radius:50%;

  background:
    rgba(8,3,4,.8);

  color:#d5b66d;

  font-size:18px;

  opacity:.48;
}


/* =========================================================
   SETTINGS PANEL
   ========================================================= */

#settingsPanel{

  position:fixed;

  top:64px;
  right:14px;

  z-index:110;

  width:
    min(
      310px,
      calc(100vw - 28px)
    );

  padding:18px;

  background:
    linear-gradient(
      145deg,
      #210608,
      #090203
    );

  border:
    1px solid #76562a;

  box-shadow:
    0 20px 50px #000;

  opacity:0;

  transform:
    translateY(-8px)
    scale(.98);

  pointer-events:none;

  transition:.2s;
}


#settingsPanel.show{

  opacity:1;

  transform:none;

  pointer-events:auto;
}


.close{

  position:absolute;

  right:10px;
  top:7px;

  background:none;

  border:0;

  color:#c7a45e;

  font-size:20px;
}


.title{

  text-align:center;

  letter-spacing:.18em;

  margin:
    0 0 14px;

  font-size:15px;
}


.row{

  border-top:
    1px solid
    #5a421f33;

  padding:
    11px 0;
}


.row label{

  display:block;

  font-size:10px;

  letter-spacing:.15em;

  text-transform:uppercase;

  color:#aa8a50;

  margin-bottom:7px;
}


.row button{

  border:
    1px solid
    #60471f;

  background:#140406;

  color:#c8a963;

  padding:
    7px 9px;

  margin:
    2px 3px 2px 0;

  font:inherit;

  font-size:12px;
}


.row button.selected{

  background:#5b0d13;

  border-color:#bb9147;

  color:#ead18a;
}


/* =========================================================
   OPTIONAL BUTTON NAVIGATION
   ========================================================= */

#navigation{

  position:fixed;

  left:50%;

  bottom:
    max(
      12px,
      env(safe-area-inset-bottom)
    );

  z-index:100;

  transform:
    translateX(-50%);

  display:none;

  gap:7px;
}


#navigation button{

  width:40px;
  height:34px;

  border:
    1px solid
    #76562b;

  background:
    #100405dd;

  color:#d1ad63;

  font-size:20px;
}


/* =========================================================
   PAGE COUNTER
   ========================================================= */

#counter{

  position:fixed;

  left:18px;

  bottom:
    max(
      15px,
      env(safe-area-inset-bottom)
    );

  z-index:100;

  color:#a4864d;

  font-size:10px;

  letter-spacing:.18em;

  opacity:.55;
}


/* =========================================================
   PORTRAIT
   ========================================================= */

@media (orientation:portrait){

  #stage::before{

    content:
      "ROTATE YOUR PHONE";

    position:fixed;

    inset:0;

    z-index:9999;

    display:grid;

    place-items:center;

    background:#030202;

    color:#c6a45e;

    font-size:13px;

    letter-spacing:.28em;
  }
}


/* =========================================================
   SMALL LANDSCAPE DEVICES
   ========================================================= */

@media (
  max-height:500px
) and (
  orientation:landscape
){

  :root{

    --book-width:
      min(
        96vw,
        calc(92vh * 1.7777778),
        1500px
      );

    --book-height:
      calc(
        var(--book-width) * .5625
      );
  }
}


/* =========================================================
   INSTANT MODE
   ========================================================= */

.instant *{

  transition:none !important;

  animation:none !important;
}

</style>
</head>


<body>


<div id="stage">

  <main
    id="book"
    aria-label="The Lore of The Last Name of God"
  >

    <div id="bookEdge"></div>


    <div id="reading">

      <div id="pageBack"></div>

      <div id="pageCurrent"></div>

      <div id="turnSheet"></div>

    </div>


    <div id="cover">

      <img
        src="cover.png"
        alt="The Lore of The Last Name of God"
      >

    </div>

  </main>

</div>



<!-- =======================================================
     SETTINGS
     ======================================================= -->

<button
  id="settingsButton"
  aria-label="Settings"
>
  ⚙
</button>


<div id="settingsPanel">

  <button
    class="close"
    id="closeSettings"
  >
    ×
  </button>


  <h2 class="title">
    BOOK SETTINGS
  </h2>


  <div class="row">

    <label>
      Page navigation
    </label>

    <button
      data-nav="swipe"
      class="selected"
    >
      Swipe
    </button>

    <button
      data-nav="buttons"
    >
      Buttons
    </button>

  </div>


  <div class="row">

    <label>
      Page turn
    </label>

    <button
      data-animation="realistic"
      class="selected"
    >
      Realistic
    </button>

    <button
      data-animation="smooth"
    >
      Smooth
    </button>

    <button
      data-animation="instant"
    >
      Instant
    </button>

  </div>


  <div class="row">

    <label>
      Sound
    </label>

    <button
      id="soundButton"
      class="selected"
    >
      Sound ON
    </button>

  </div>


  <div class="row">

    <label>
      Screen
    </label>

    <button
      id="fullscreenButton"
    >
      Fullscreen
    </button>

  </div>

</div>



<!-- =======================================================
     OPTIONAL NAVIGATION
     ======================================================= -->

<div id="navigation">

  <button id="prev">
    ‹
  </button>

  <button id="next">
    ›
  </button>

</div>


<div id="counter"></div>



<script>

(() => {

"use strict";


/* =========================================================
   REPOSITORY
   ========================================================= */

const REPO =
  "Akshay-s-coder/The-Lore-of-The-Last-Name-of-God-";

const BRANCH =
  "main";


const API =
  `https://api.github.com/repos/${REPO}/contents/pages?ref=${BRANCH}`;


const RAW =
  `https://raw.githubusercontent.com/${REPO}/${BRANCH}/pages/`;



/* =========================================================
   DOM
   ========================================================= */

const book =
  document.getElementById("book");

const cover =
  document.getElementById("cover");

const current =
  document.getElementById("pageCurrent");

const back =
  document.getElementById("pageBack");

const turn =
  document.getElementById("turnSheet");

const counter =
  document.getElementById("counter");

const settings =
  document.getElementById("settingsPanel");

const navigation =
  document.getElementById("navigation");



/* =========================================================
   STATE
   ========================================================= */

let pages = [];

let index = -1;

let opened = false;

let busy = false;

let drag = null;

let navMode = "swipe";

let animationMode =
  "realistic";

let sound = true;

let audio = null;

let suppressClickUntil = 0;



/* =========================================================
   IMAGE
   ========================================================= */

function image(url){

  const img =
    document.createElement("img");

  img.src = url;

  img.alt = "";

  img.draggable = false;

  return img;
}


/* =========================================================
   PAGE URL
   ========================================================= */

function pageURL(name){

  return (
    RAW +
    encodeURIComponent(name)
  );
}


/* =========================================================
   SORT PAGES
   =========================================================

   ONLY PNG files become pages.

   001.png
   002.png
   003.png

   etc.

   No HTML placeholder.
   No blank page.
   No fake page.

   ========================================================= */

function sortPages(list){

  return list

    .filter(
      item =>
        item.type === "file" &&
        /\.png$/i.test(item.name)
    )

    .sort(
      (a,b) =>
        a.name.localeCompare(
          b.name,
          undefined,
          {
            numeric:true,
            sensitivity:"base"
          }
        )
    );
}



/* =========================================================
   LOAD PAGES FROM GITHUB
   ========================================================= */

async function loadPages(){

  try{

    const response =
      await fetch(
        API,
        {
          cache:"no-store"
        }
      );


    /*
       If pages/ doesn't exist yet,
       simply treat the book as having
       zero lore pages.

       NEVER display an error over
       the artwork.
    */

    if(!response.ok){

      return;

    }


    const data =
      await response.json();


    pages =
      sortPages(data)
        .map(
          item => ({
            name:item.name,
            url:pageURL(item.name)
          })
        );


    if(
      index >= pages.length
    ){

      index =
        Math.max(
          0,
          pages.length - 1
        );

    }


    render();

  }

  catch(error){

    /*
       Deliberately silent.

       The reader should never see
       technical GitHub errors.
    */

  }

}



/* =========================================================
   RENDER CURRENT PAGE
   ========================================================= */

function render(){

  if(index < 0){

    counter.textContent = "";

    return;

  }


  const page =
    pages[index];


  if(!page){

    counter.textContent = "";

    return;

  }


  current.innerHTML = "";

  current.appendChild(
    image(page.url)
  );


  const underneath =
    pages[index + 1];


  back.innerHTML = "";


  if(underneath){

    back.appendChild(
      image(
        underneath.url
      )
    );

  }


  counter.textContent =
    `PAGE ${index + 1} / ${pages.length}`;

}



/* =========================================================
   AUDIO ENGINE
   ========================================================= */

function ensureAudio(){

  if(audio){

    return audio;

  }


  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;


  if(!AudioContext){

    return null;

  }


  audio =
    new AudioContext();


  return audio;

}



/* =========================================================
   PAPER SOUND

   Very short filtered noise.

   No huge bass hit.
   No metallic click.
   No long artificial swoosh.
   ========================================================= */

function paperSound(){

  if(!sound){

    return;

  }


  const ctx =
    ensureAudio();


  if(!ctx){

    return;

  }


  if(
    ctx.state === "suspended"
  ){

    ctx.resume();

  }


  const duration =
    0.16;


  const samples =
    Math.floor(
      ctx.sampleRate *
      duration
    );


  const buffer =
    ctx.createBuffer(
      1,
      samples,
      ctx.sampleRate
    );


  const data =
    buffer.getChannelData(0);


  let previous = 0;


  for(
    let i = 0;
    i < samples;
    i++
  ){

    const progress =
      i / samples;


    const envelope =
      Math.sin(
        Math.PI *
        progress
      ) ** 1.6;


    const white =
      Math.random() * 2 - 1;


    previous =
      previous * .72 +
      white * .28;


    data[i] =
      previous *
      envelope *
      .42;

  }


  const source =
    ctx.createBufferSource();


  const filter =
    ctx.createBiquadFilter();


  const gain =
    ctx.createGain();


  source.buffer =
    buffer;


  filter.type =
    "bandpass";


  filter.frequency.value =
    1700;


  filter.Q.value =
    .7;


  gain.gain.setValueAtTime(
    .0001,
    ctx.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    .16,
    ctx.currentTime + .018
  );


  gain.gain.exponentialRampToValueAtTime(
    .0001,
    ctx.currentTime + duration
  );


  source
    .connect(filter)
    .connect(gain)
    .connect(ctx.destination);


  source.start();

}



/* =========================================================
   COVER SOUND
   ========================================================= */

function coverSound(){

  if(!sound){

    return;

  }


  const ctx =
    ensureAudio();


  if(!ctx){

    return;

  }


  if(
    ctx.state === "suspended"
  ){

    ctx.resume();

  }


  const oscillator =
    ctx.createOscillator();


  const gain =
    ctx.createGain();


  oscillator.type =
    "triangle";


  oscillator.frequency.setValueAtTime(
    82,
    ctx.currentTime
  );


  oscillator.frequency.exponentialRampToValueAtTime(
    48,
    ctx.currentTime + .28
  );


  gain.gain.setValueAtTime(
    .0001,
    ctx.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    .045,
    ctx.currentTime + .025
  );


  gain.gain.exponentialRampToValueAtTime(
    .0001,
    ctx.currentTime + .3
  );


  oscillator
    .connect(gain)
    .connect(ctx.destination);


  oscillator.start();


  oscillator.stop(
    ctx.currentTime + .31
  );


  paperSound();

}



/* =========================================================
   FULLSCREEN
   ========================================================= */

async function fullscreen(){

  try{

    if(
      !document.fullscreenElement
    ){

      await document
        .documentElement
        .requestFullscreen();

    }


    if(
      screen.orientation &&
      screen.orientation.lock
    ){

      await screen.orientation
        .lock("landscape")
        .catch(
          () => {}
        );

    }

  }

  catch(error){

  }

}



/* =========================================================
   OPEN BOOK
   ========================================================= */

async function openBook(){

  if(opened){

    return;

  }


  await loadPages();


  opened = true;

  index =
    pages.length
      ? 0
      : 0;


  cover.style.transition =
    "transform .95s cubic-bezier(.16,.82,.18,1)";


  cover.classList.add(
    "open"
  );


  coverSound();


  fullscreen();


  setTimeout(
    () => {

      cover.style.transition =
        "";

      render();

    },
    980
  );

}



/* =========================================================
   CLOSE BOOK
   ========================================================= */

function closeBook(){

  if(
    !opened ||
    busy
  ){

    return;

  }


  busy = true;


  cover.style.transition =
    "transform .72s cubic-bezier(.16,.82,.18,1)";


  cover.classList.remove(
    "open"
  );


  cover.style.transform =
    "";


  coverSound();


  setTimeout(
    () => {

      opened = false;

      index = -1;

      busy = false;

      cover.style.transition =
        "";

      render();

    },
    740
  );

}



/* =========================================================
   CAN FLIP?
   ========================================================= */

function can(direction){

  if(
    !opened ||
    busy ||
    !pages.length
  ){

    return false;

  }


  if(direction > 0){

    return (
      index <
      pages.length - 1
    );

  }


  return index > 0;

}



/* =========================================================
   PREPARE FULL PAGE TURN
   ========================================================= */

function setupTurn(direction){

  /*
     IMPORTANT:

     The turning sheet is ALWAYS
     the current full-width page.

     The destination goes underneath.

     This makes the page behave like
     a real sheet instead of a narrow
     half-page object.
  */

  const target =
    pages[index];


  if(!target){

    return false;

  }


  turn.innerHTML = "";


  turn.appendChild(
    image(target.url)
  );


  turn.className =
    (
      direction > 0
        ? "next"
        : "prev"
    ) +
    " active";


  turn.style.transition =
    "none";


  turn.style.transform =
    "rotateY(0deg)";


  back.innerHTML = "";


  const destination =
    pages[index + direction];


  if(destination){

    back.appendChild(
      image(
        destination.url
      )
    );

  }


  return true;

}



/* =========================================================
   COMPLETE TURN
   ========================================================= */

function finishTurn(
  direction,
  duration = 720
){

  busy = true;


  turn.style.transition =
    `transform ${duration}ms cubic-bezier(.18,.78,.12,1)`;


  turn.style.transform =
    direction > 0
      ? "rotateY(-180deg)"
      : "rotateY(180deg)";


  paperSound();


  setTimeout(
    () => {

      index +=
        direction;


      turn.className =
        "";


      turn.style.cssText =
        "";


      busy = false;


      render();

    },
    duration + 25
  );

}



/* =========================================================
   NORMAL FLIP
   ========================================================= */

function flip(direction){

  if(!opened){

    openBook();

    return;

  }


  if(
    direction < 0 &&
    index === 0
  ){

    closeBook();

    return;

  }


  if(
    !can(direction)
  ){

    return;

  }


  if(
    !setupTurn(direction)
  ){

    return;

  }


  finishTurn(
    direction,
    animationMode === "realistic"
      ? 720
      : animationMode === "smooth"
      ? 480
      : 1
  );

}



/* =========================================================
   POINTER START
   ========================================================= */

book.addEventListener(
  "pointerdown",
  event => {

    if(
      !opened ||
      busy ||
      navMode !== "swipe"
    ){

      return;

    }


    if(
      event.pointerType === "mouse" &&
      event.button !== 0
    ){

      return;

    }


    drag = {

      id:event.pointerId,

      x:event.clientX,

      y:event.clientY,

      time:performance.now(),

      moved:false,

      cover:false

    };


    if(
      book.setPointerCapture
    ){

      book.setPointerCapture(
        event.pointerId
      );

    }

  }
);



/* =========================================================
   POINTER MOVE

   Gesture controls the page directly.
   ========================================================= */

book.addEventListener(
  "pointermove",
  event => {

    if(
      !drag ||
      drag.id !== event.pointerId ||
      busy
    ){

      return;

    }


    const dx =
      event.clientX -
      drag.x;


    const dy =
      event.clientY -
      drag.y;


    if(
      Math.abs(dx) < 4
    ){

      return;

    }


    /*
       Ignore mostly vertical
       gestures.
    */

    if(
      Math.abs(dx) <
      Math.abs(dy) * 1.15
    ){

      return;

    }


    event.preventDefault();


    drag.moved = true;


    /*
       At page 1, swiping right
       physically closes the cover.
    */

    if(
      index === 0 &&
      dx > 0
    ){

      drag.cover = true;


      const progress =
        Math.max(
          0,
          Math.min(
            1,
            dx /
            book.clientWidth
          )
        );


      cover.style.transition =
        "none";


      cover.style.transform =
        `rotateY(${
          -168 +
          168 * progress
        }deg)`;


      return;

    }


    /*
       LEFT = NEXT
       RIGHT = PREVIOUS
    */

    const direction =
      dx < 0
        ? 1
        : -1;


    if(
      !can(direction)
    ){

      return;

    }


    if(
      !turn.classList.contains(
        "active"
      )
    ){

      setupTurn(
        direction
      );

    }


    const progress =
      Math.max(
        0,
        Math.min(
          1,
          Math.abs(dx) /
          book.clientWidth
        )
      );


    turn.style.transition =
      "none";


    turn.style.transform =
      `rotateY(${
        direction > 0
          ? -180 * progress
          : 180 * progress
      }deg)`;

  }
);



/* =========================================================
   POINTER END
   ========================================================= */

function endPointer(event){

  if(
    !drag ||
    drag.id !== event.pointerId
  ){

    return;

  }


  const state =
    drag;


  drag = null;


  const dx =
    event.clientX -
    state.x;


  const dt =
    Math.max(
      1,
      performance.now() -
      state.time
    );


  const velocity =
    Math.abs(dx) /
    dt;


  if(
    !state.moved
  ){

    return;

  }


  /*
     Prevent the cover click event
     from firing immediately after
     a real swipe.
  */

  suppressClickUntil =
    performance.now() +
    350;



  /* =======================================================
     COVER SWIPE BACK
     ======================================================= */

  if(
    index === 0 &&
    dx > 0
  ){

    const progress =
      Math.abs(dx) /
      book.clientWidth;


    if(
      progress > .16 ||
      velocity > .45
    ){

      cover.style.transition =
        "transform .58s cubic-bezier(.16,.82,.18,1)";


      cover.classList.remove(
        "open"
      );


      cover.style.transform =
        "";


      coverSound();


      setTimeout(
        () => {

          opened = false;

          index = -1;

          cover.style.transition =
            "";

          render();

        },
        600
      );

    }

    else{

      cover.style.transition =
        "transform .3s cubic-bezier(.2,.8,.2,1)";


      cover.classList.add(
        "open"
      );


      setTimeout(
        () => {

          cover.style.transition =
            "";

        },
        320
      );

    }


    turn.className =
      "";

    turn.style.cssText =
      "";

    return;

  }



  /* =======================================================
     NORMAL PAGE
     ======================================================= */

  const direction =
    dx < 0
      ? 1
      : -1;


  const progress =
    Math.abs(dx) /
    book.clientWidth;


  if(
    !can(direction)
  ){

    turn.className =
      "";

    turn.style.cssText =
      "";

    return;

  }


  /*
     Complete if:

       18% movement

     OR

       fast flick
  */

  if(
    progress > .18 ||
    velocity > .45
  ){

    if(
      !turn.classList.contains(
        "active"
      )
    ){

      setupTurn(
        direction
      );

    }


    finishTurn(
      direction,
      animationMode === "realistic"
        ? 520
        : animationMode === "smooth"
        ? 360
        : 1
    );

  }

  else{

    /*
       Not enough movement:
       spring the sheet back.
    */

    turn.style.transition =
      "transform .3s cubic-bezier(.2,.8,.2,1)";


    turn.style.transform =
      "rotateY(0deg)";


    setTimeout(
      () => {

        turn.className =
          "";

        turn.style.cssText =
          "";

      },
      320
    );

  }

}


book.addEventListener(
  "pointerup",
  endPointer
);


book.addEventListener(
  "pointercancel",
  endPointer
);



/* =========================================================
   COVER TAP
   ========================================================= */

cover.addEventListener(
  "click",
  () => {

    if(
      !drag &&
      !opened &&
      performance.now() >
      suppressClickUntil
    ){

      openBook();

    }

  }
);



/* =========================================================
   BUTTON NAVIGATION
   ========================================================= */

document
  .getElementById("next")
  .onclick =
    () => flip(1);


document
  .getElementById("prev")
  .onclick =
    () => flip(-1);



/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "ArrowRight"
    ){

      flip(1);

    }


    if(
      event.key ===
      "ArrowLeft"
    ){

      flip(-1);

    }


    if(
      event.key ===
      "Escape"
    ){

      settings.classList.remove(
        "show"
      );

    }

  }
);



/* =========================================================
   SETTINGS
   ========================================================= */

document
  .getElementById(
    "settingsButton"
  )
  .onclick =
    () =>
      settings.classList.toggle(
        "show"
      );


document
  .getElementById(
    "closeSettings"
  )
  .onclick =
    () =>
      settings.classList.remove(
        "show"
      );



/* =========================================================
   NAVIGATION MODE
   ========================================================= */

document
  .querySelectorAll(
    "[data-nav]"
  )
  .forEach(
    button => {

      button.onclick =
        () => {

          navMode =
            button.dataset.nav;


          document
            .querySelectorAll(
              "[data-nav]"
            )
            .forEach(
              item =>
                item.classList.toggle(
                  "selected",
                  item === button
                )
            );


          navigation.style.display =
            navMode === "buttons"
              ? "flex"
              : "none";

        };

    }
  );



/* =========================================================
   ANIMATION MODE
   ========================================================= */

document
  .querySelectorAll(
    "[data-animation]"
  )
  .forEach(
    button => {

      button.onclick =
        () => {

          animationMode =
            button.dataset.animation;


          document
            .querySelectorAll(
              "[data-animation]"
            )
            .forEach(
              item =>
                item.classList.toggle(
                  "selected",
                  item === button
                )
            );


          document.body.classList.toggle(
            "instant",
            animationMode ===
            "instant"
          );

        };

    }
  );



/* =========================================================
   SOUND
   ========================================================= */

document
  .getElementById(
    "soundButton"
  )
  .onclick =
    event => {

      sound =
        !sound;


      event.currentTarget.textContent =
        sound
          ? "Sound ON"
          : "Sound OFF";


      event.currentTarget.classList.toggle(
        "selected",
        sound
      );

    };



/* =========================================================
   FULLSCREEN
   ========================================================= */

document
  .getElementById(
    "fullscreenButton"
  )
  .onclick =
    fullscreen;



/* =========================================================
   INITIAL LOAD
   ========================================================= */

loadPages();



/* =========================================================
   ARCHIVE REFRESH

   Adding:

      pages/007.png

   automatically makes page 7
   appear after the next refresh.

   ========================================================= */

setInterval(
  loadPages,
  30000
);


})();

</script>

</body>
</html>
